# Uzak CI (mimari.md §5): tools/ci_local.sh ile aynı adımlar, aynı sırayla.
# Adımlar ci_local.sh'tan tek tek çağrılır; adım eklenir/değişirse ikisi birlikte güncellenir.
# dev ve main push'u: ci işi (godot import unit tools net). main push'u ve `test-*` etiketi: ci yeşilse build işi
# (`tools/ci_local.sh godot import export`) Windows + Linux build'lerini artifact olarak yükler (IS-005).
# Yalnız `test-*` etiketi (faz-* değil): build sürümlü zip'leri üretir, release işi bunları GitHub Release'e
# (prerelease) ekler (IS-042); bu build'ler debug şablonuyla çıkar (EXPORT_DEBUG=1, IS-076), main artefaktları
# release şablonuyla. Yazma izni yalnız release işinde.
name: CI

on:
  push:
    branches: [dev, main]
    tags: ["test-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Godot içe aktarma + testler
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Uzak CI logu ayrıntılı kalsın (IS-090): ci_local.sh yerelde varsayılan kısa kipte, burada eski çıktı.
    env:
      CI_VERBOSE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Godot ikilisi .tools/ altında; anahtar sürümü tutan get_godot.sh'a bağlı.
      - name: Godot önbelleği
        uses: actions/cache@v6
        with:
          path: .tools
          key: godot-${{ runner.os }}-${{ hashFiles('tools/get_godot.sh') }}

      - name: Godot getir
        run: bash tools/ci_local.sh godot

      - name: İçe aktarma (hata/uyarı yok)
        run: bash tools/ci_local.sh import

      - name: Birim testler (çıkışta sızıntı yok)
        run: bash tools/ci_local.sh unit

      - name: Araç testleri (gecikme proxy'si, net_smoke süreç öldürme)
        run: bash tools/ci_local.sh tools

      - name: Ağ duman senaryoları (0 ve 150 ms)
        run: bash tools/ci_local.sh net

  build:
    name: Windows + Linux build
    needs: ci
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/test-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Godot önbelleği
        uses: actions/cache@v6
        with:
          path: .tools
          key: godot-${{ runner.os }}-${{ hashFiles('tools/get_godot.sh') }}

      # Şablonlar (~1,3 GB arşivden yalnız Windows/Linux x86_64) kullanıcı veri dizinine kurulur. Anahtar yalnız
      # şablon sürümüne ve arşiv özetine bağlı (export.sh'ın geri kalanı değişince yeniden indirilmez).
      - name: Export şablonları önbellek anahtarı
        id: templates
        run: echo "key=$(grep -E '^TEMPLATES_(VERSION|TPZ_SHA512)=' tools/export.sh | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Export şablonları önbelleği
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ runner.os }}-${{ steps.templates.outputs.key }}

      - name: Godot getir
        run: bash tools/ci_local.sh godot

      - name: İçe aktarma (hata/uyarı yok)
        run: bash tools/ci_local.sh import

      # `test-*` etiketinde arkadaş test build'i debug şablonuyla (IS-076): GDScript çalışma zamanı hataları ve
      # crash handler log'a yazılır. main push artefaktları release şablonuyla kalır. Duman koşusu iki durumda da.
      - name: Build (Windows + Linux) ve Linux build'iyle duman koşusu
        env:
          EXPORT_DEBUG: ${{ startsWith(github.ref, 'refs/tags/test-') && '1' || '' }}
        run: bash tools/ci_local.sh export

      - name: Windows build'ini yükle
        uses: actions/upload-artifact@v7
        with:
          name: insiders-windows-x86_64-${{ github.sha }}
          path: build/windows/
          if-no-files-found: error
          retention-days: 30

      # Zip içinde çalıştırma izni kaybolmasın diye Linux build'i tar.gz olarak yüklenir.
      - name: Linux build'ini yükle
        uses: actions/upload-artifact@v7
        with:
          name: insiders-linux-x86_64-${{ github.sha }}
          path: build/Insiders-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

      # Etikette: sürümlü zip'ler (Windows klasörü; Linux ikilisi zip'te çalıştırma izniyle, unzip korur).
      # Her zip içinde aynı adlı tek klasör olur.
      - name: Release zip'leri (test-* etiketi)
        if: startsWith(github.ref, 'refs/tags/test-')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf build/release && mkdir -p build/release/stage
          for platform in windows linux; do
            name="Insiders-${TAG}-${platform}"
            cp -a "build/${platform}" "build/release/stage/${name}"
            (cd build/release/stage && zip -q -r -X "../${name}.zip" "${name}")
          done
          unzip -Z "build/release/Insiders-${TAG}-linux.zip" | grep -E '^-rwx.*/Insiders\.x86_64$'
          ls -l build/release/*.zip

      - name: Release zip'lerini yükle (test-* etiketi)
        if: startsWith(github.ref, 'refs/tags/test-')
        uses: actions/upload-artifact@v7
        with:
          name: release-zips
          path: build/release/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release (test-* etiketi)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/test-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # checkout etiketi hafif etikete çevirebilir; mesaj için açıklamalı etiket nesnesi yeniden alınır.
      - name: Release gövdesi (etiket mesajı + README bağlantısı)
        env:
          TAG: ${{ github.ref_name }}
          README_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README.md
        run: |
          set -euo pipefail
          git fetch --force --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" == tag ]]; then
            msg="$(git tag -l --format='%(contents)' "${TAG}")"
          else
            msg="(etiket mesajı yok)"
          fi
          {
            echo "${msg}"
            echo
            echo "**Debug build** (debug şablonu): betik hataları ve çökmeler günlük dosyasına iziyle yazılır; sorun bildirirken günlüğü gönderin."
            echo
            echo "Kurulum, Tailscale ile bağlanma ve sorun bildirme: [README](${README_URL}#arkadaşla-internet-üzerinden-tailscale)"
          } > "${RUNNER_TEMP}/release-body.md"
          cat "${RUNNER_TEMP}/release-body.md"

      - uses: actions/download-artifact@v7
        with:
          name: release-zips
          path: dist

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Insiders ${{ github.ref_name }}
          prerelease: true
          body_path: ${{ runner.temp }}/release-body.md
          files: dist/*.zip
          fail_on_unmatched_files: true
